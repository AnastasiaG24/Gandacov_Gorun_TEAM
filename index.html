<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculator modern pentru reduceri în MDL, cu istoric salvat local.">
  <title>Calculator Reduceri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="calculator-card" aria-labelledby="app-title">
      <div class="card-header">
        <p class="eyebrow">Instrument rapid</p>
        <h1 id="app-title">Calculator Reduceri</h1>
        <p class="intro">Calculează imediat valoarea reducerii și prețul final în MDL.</p>
      </div>

      <form id="discount-form" novalidate>
        <div class="form-grid">
          <div class="field-group">
            <label for="original-price">Prețul inițial (MDL)</label>
            <input
              type="number"
              id="original-price"
              name="originalPrice"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              placeholder="Ex: 1200.00"
              aria-describedby="original-price-error"
            >
            <p class="error-message" id="original-price-error" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="discount-percentage">Procentul reducerii (%)</label>
            <input
              type="number"
              id="discount-percentage"
              name="discountPercentage"
              inputmode="decimal"
              min="0"
              max="100"
              step="0.01"
              placeholder="Ex: 15"
              aria-describedby="discount-percentage-error"
            >
            <p class="error-message" id="discount-percentage-error" aria-live="polite"></p>
          </div>
        </div>

        <div class="button-row">
          <button class="button button-primary" type="submit">Calculează</button>
          <button class="button button-secondary" type="button" id="reset-button">Resetează</button>
        </div>
      </form>

      <section class="results-panel" aria-labelledby="results-title">
        <h2 id="results-title">Rezultate</h2>
        <div class="result-grid">
          <article class="result-card">
            <span>Valoarea reducerii</span>
            <strong id="discount-amount">0.00 MDL</strong>
          </article>
          <article class="result-card result-card-accent">
            <span>Prețul final</span>
            <strong id="final-price">0.00 MDL</strong>
          </article>
        </div>
      </section>
    </section>

    <section class="history-card" aria-labelledby="history-title">
      <div class="history-header">
        <div>
          <p class="eyebrow">Ultimele calcule</p>
          <h2 id="history-title">Istoric</h2>
        </div>
        <button class="button button-ghost" type="button" id="clear-history-button">Șterge istoricul</button>
      </div>
      <ol class="history-list" id="history-list" aria-live="polite"></ol>
      <p class="empty-history" id="empty-history">Nu există calcule salvate încă.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
